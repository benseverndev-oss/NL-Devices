id: sensor_temp_lm75
version: 0.1.0
function: "I2C temperature sensor (LM75A)"
atopile_module: TempBlock
tags: [sensor, temperature, temp, i2c]
bound_part:
  lcsc: C477979
  mpn: LM75AIMX/NOPB
  manufacturer: Texas Instruments
  footprint: SOIC-8
ports:
  power: {type: power, role: sink, voltage: 3.3, tolerance: 0.05, current_ma: 1}
  i2c:
    type: i2c
    role: peripheral
    address_base: 0x48          # strappable 0x48..0x4F
    address_bits: 3
    provides_pullups: false
codegen:
  part_instance: lm75
  address_pins: [A0, A1, A2]
