# Pinned to the known-good line (DECISION.md step 1). 0.13+ requires Python 3.14
# (RC, crashes); the 3.13 pin in ../../.python-version caps atopile to 0.12.x.
# Reproducible install: ../../scripts/setup.sh  (atopile==0.12.5 / Python 3.13).
requires-atopile: ">=0.12.5"
builds:
  divider:
    entry: main.ato:Divider
  sensor_node:
    entry: sensor_node.ato:App
  fault1:
    entry: sensor_node.ato:AppFault1PowerDomain
  fault2:
    entry: sensor_node.ato:AppFault2NoPulls
  fault3:
    entry: sensor_node.ato:AppFault3AddrCollision
  verified:
    entry: verified_slice.ato:App
  spi_node:
    entry: spi_slice.ato:App
