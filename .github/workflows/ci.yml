name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # the pinned project Python (.python-version)
      - name: Toolchain pin consistency (offline, no deps)
        run: python3 scripts/check_toolchain.py
      - name: Install ngspice (BSD electrical-gate backend)
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install Python deps
        run: pip install -r spike/requirements.txt
      - name: Validator + contract + orchestrator + planner eval
        working-directory: spike
        run: |
          python3 place.py --selftest    # pure placement, against committed fixture
          python3 route.py --selftest    # pure output parsers, against committed fixtures
          python3 seam_validator.py
          python3 block_contract.py --faults
          python3 validator_corpus.py    # adversarial corpus; gates on covered-fault regressions
          python3 orchestrator.py
          python3 eval_planner.py        # offline FakeModel; gates on 0-hallucination
      - name: Ground-truth part-data gate (offline, no network)
        working-directory: spike
        run: |
          python3 verify_parts.py            # every bound block vs pinned snapshot
          python3 verify_parts.py --selftest # injected part-data faults must be caught
      - name: Electrical — analytic gate + real ngspice transient sims
        working-directory: spike
        run: |
          python3 electrical.py              # analytic LDO dropout-margin check (has teeth)
          python3 spice_sim.py --selftest    # REAL .tran: I2C rise + rail droop; cross-checks the analytic limit
      - name: Fab export — package build + dry-run JLCPCB order (offline)
        working-directory: spike
        run: python3 fab_export.py --selftest  # BOM/CPL/Gerber/drill + validated order (never submits)

  toolchain:
    name: Pinned atopile install (0.12.5 / Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup script — installs + verifies the pinned toolchain
        # Proves the documented setup actually resolves atopile==0.12.5 on Python 3.13
        # (and runs the offline consistency gate at the end). ngspice is optional here.
        run: bash scripts/setup.sh

  make-spi-part:
    # TEMPORARY one-shot job (Workstream 2, Phase 1). Creates the real W25Q128
    # SPI flash part (LCSC C97521, SOIC-8) via `ato create part`, ingests its
    # ground-truth into parts_snapshot.json, and commits both back to the branch
    # with [skip ci]. Mirrors the part-fetch scaffolding the existing parts used.
    # REMOVE this job once the part dir + snapshot are committed.
    name: Create + ingest W25Q128 SPI flash part (one-shot)
    if: github.ref == 'refs/heads/feat/spi-routed-board'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install pinned atopile toolchain
        run: bash scripts/setup.sh
      - name: Install spike Python deps (partdb ingest needs requests + pyyaml)
        run: pip install -r spike/requirements.txt && pip install requests
      - name: Create the W25Q128 part (ato create part, non-interactive)
        working-directory: spike/atopile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ato create part --search C97521 --accept-single
          echo "== generated part dirs =="
          ls -la elec/src/parts/
      - name: Ingest C97521 into the ground-truth snapshot (EasyEDA + LCSC)
        working-directory: spike
        run: python3 partdb.py ingest C97521
      - name: Commit the part dir + updated snapshot back to the branch
        run: |
          git config user.name benzsevern
          git config user.email benzsevern@gmail.com
          git add spike/atopile/elec/src/parts/ spike/parts_snapshot.json
          git status --short
          git commit -m "Create + ingest W25Q128 (C97521) SPI flash part [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push

  route:
    name: Autoroute → routed copper (verified board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install pinned atopile toolchain
        run: bash scripts/setup.sh
      - name: Install spike Python deps (route.py → fab_export needs pyyaml)
        run: pip install -r spike/requirements.txt
      - name: Install KiCad 9 (kicad-cli + pcbnew)
        # Pinned KiCad 9 for the Specctra round-trip (pcbnew), DRC + Gerber export.
        # Pin linted by scripts/check_toolchain.py against KICAD_VERSION.
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Install Java 21 (freerouting 2.1.0 needs class-file 65 / JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned freerouting
        run: |
          curl -fL -o freerouting.jar \
            "https://github.com/freerouting/freerouting/releases/download/v2.1.0/freerouting-2.1.0.jar"
          java -jar freerouting.jar --help 2>&1 | head -40 || true
      - name: ato build verified (reproducible — 3D models committed)
        # Board = verified_slice.ato:App (real AMS1117 LDO C6186 + STM32F103C8T6 MCU
        # C8734 + AT24C256 EEPROM C6482 + decoupling + I2C pull-ups). The per-part 3D
        # models are committed under
        # elec/src/parts/**, so this build is reproducible with no network model fetch
        # (only the LCSC part-pick hits the network). Produces the unrouted .kicad_pcb
        # the routing pipeline (Task 4) consumes.
        working-directory: spike/atopile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ato build -b verified
          echo "== located boards ==" ; find . -name '*.kicad_pcb'
      - name: Route the board (place → DSN → freerouting → SES → DRC → Gerbers)
        # HARD GATE: route.py exits nonzero unless 0 unrouted nets + 0 DRC violations
        # + all required copper layers exported. python3 here is the 3.13 venv; it shells
        # to /usr/bin/python3 for pcbnew (Specctra), java for freerouting, kicad-cli.
        run: |
          python3 spike/route.py --pipeline \
            --board spike/atopile/elec/layout/verified/verified.kicad_pcb \
            --jar freerouting.jar \
            --specctra spike/scripts/kicad_specctra.py \
            --work spike/build/route
